name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# only the newest commit on a branch is tested; older runs are cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_COMMIT: 9309bf1
  STORIES_URL: https://huggingface.co/ggml-org/stories15M_MOE/resolve/main/stories15M_MOE-Q8_0.gguf
  STORIES_SHA: c7aa6863f9a4b3cdf19716e2c95622dcbd3bd06989324bf1ac8e60486ef8e881

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - run: cargo test --release --locked
      - if: runner.os == 'Linux'
        run: cargo clippy --release --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo package --no-verify

  msrv:
    # Cargo.toml promises a minimum Rust version; build with exactly that one
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.89"
      - run: cargo check --release --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: cd phase0 && pytest -q

  engine:
    # build against the pinned llama.cpp with the ladder patch, then prove streaming is
    # byte-identical to stock llama.cpp on a small MoE, on every desktop OS, and run the
    # end-to-end smoke test (compare, pick, server hardening, a completion)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-14
            name: macos-arm64-metal
          - os: windows-latest
            name: windows-x64
    name: engine (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: runner.os == 'macOS'
        run: brew install ninja
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: llama.cpp with the ladder patch
        run: |
          git clone https://github.com/ggml-org/llama.cpp ../llama.cpp
          cd ../llama.cpp && git checkout $LLAMA_COMMIT
          git apply --ignore-whitespace ../banach/engine/patches/0001-banach-precision-ladder.patch
      - name: build engine and tracer
        run: |
          cmake -S engine -B build-engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_DIR="$PWD/../llama.cpp" -DBANACH_PORTABLE=ON
          cmake --build build-engine --target banach-engine
          cmake -S tracer -B build-trace -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_DIR="$PWD/../llama.cpp"
          cmake --build build-trace --target banach-trace
      - name: tiny model
        run: |
          curl -fsSL -o stories.gguf "$STORIES_URL"
          python3 -c "import hashlib,sys; h=hashlib.sha256(open('stories.gguf','rb').read()).hexdigest(); sys.exit(h!='$STORIES_SHA')"
          echo "Once upon a time there was a robot who" > prompt.txt
      - name: byte-exact streaming oracle
        run: |
          exe=build-engine/banach-engine; [ -f "$exe.exe" ] && exe="$exe.exe"
          engine/exact_check.sh "$exe" stories.gguf prompt.txt 16
      - name: end-to-end smoke test
        run: |
          cargo build --release --locked
          engine=build-engine/banach-engine; cli=target/release/banach
          [ -f "$engine.exe" ] && engine="$engine.exe" && cli="$cli.exe"
          scripts/smoke_test.sh "$cli" "$engine" stories.gguf prompt.txt

  engine-gpu:
    # GPU backends: compile the engine with CUDA and with Vulkan (no GPU on the runners, so
    # these prove the build only; no GPU benchmark has been run)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cuda
            container: nvidia/cuda:12.6.3-devel-ubuntu24.04
            deps: cmake ninja-build git
            flags: -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=86
          - name: vulkan
            container: ubuntu:24.04
            deps: cmake ninja-build git g++ libvulkan-dev glslc spirv-headers
            flags: -DGGML_VULKAN=ON
    name: engine (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ${{ matrix.deps }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: banach
      - name: llama.cpp with the ladder patch
        run: |
          git clone https://github.com/ggml-org/llama.cpp llama.cpp
          cd llama.cpp && git checkout $LLAMA_COMMIT
          git apply ../banach/engine/patches/0001-banach-precision-ladder.patch
      - name: build engine
        run: |
          cmake -S banach/engine -B build-engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_DIR="$PWD/llama.cpp" -DBANACH_PORTABLE=ON ${{ matrix.flags }}
          cmake --build build-engine --target banach-engine
          test -x build-engine/banach-engine
