name: release

# Release by pushing a tag like v0.1.0, or from the Actions tab: "release" -> "Run workflow"
# with a version (the workflow then creates the tag and the GitHub release itself).
# One-time setup (see RELEASING.md):
#   PyPI   trusted publisher for this repo and workflow (no secret needed)
#   npm    repository secret NPM_TOKEN
#   crates repository secret CARGO_REGISTRY_TOKEN
#   GHCR   nothing (uses GITHUB_TOKEN)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (must match Cargo.toml)"
        required: true

permissions:
  contents: read

env:
  LLAMA_COMMIT: 9309bf1
  # v0.1.0 from a pushed tag, or "v" + the version typed into "Run workflow"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches every package version
        run: |
          v="${RELEASE_TAG#v}"
          grep -q "^version = \"$v\"" Cargo.toml
          grep -q "^version = \"$v\"" python/pyproject.toml
          grep -q "\"version\": \"$v\"" npm/banach/package.json
          echo "releasing $RELEASE_TAG"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            npm: linux-x64
            wheel: manylinux_2_28_x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            ggml: -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
          - target: aarch64-unknown-linux-gnu
            npm: linux-arm64
            wheel: manylinux_2_28_aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            ggml: -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod
          - target: aarch64-apple-darwin
            npm: darwin-arm64
            wheel: macosx_14_0_arm64
            runner: macos-14
            container: ""
            ggml: ""
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: tools
        shell: bash
        run: |
          if [ -n "${{ matrix.container }}" ]; then
            /opt/python/cp312-cp312/bin/python -m pip install cmake ninja wheel setuptools
            echo "/opt/python/cp312-cp312/bin" >> $GITHUB_PATH
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            dnf install -y git
          else
            brew install ninja
            python3 -m pip install --break-system-packages wheel setuptools
          fi
      - name: llama.cpp with the ladder patch
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git clone https://github.com/ggml-org/llama.cpp ../llama.cpp
          cd ../llama.cpp && git checkout $LLAMA_COMMIT
          git apply $GITHUB_WORKSPACE/engine/patches/0001-banach-precision-ladder.patch
      - name: engine
        shell: bash
        run: |
          cmake -S engine -B build-engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_DIR=$GITHUB_WORKSPACE/../llama.cpp \
            -DBANACH_PORTABLE=ON ${{ matrix.ggml }}
          ninja -C build-engine banach-engine
      - name: cli
        shell: bash
        run: cargo build --release
      - name: package
        shell: bash
        run: |
          mkdir -p dist stage
          cp target/release/banach build-engine/banach-engine stage/
          tar -czf dist/banach-${{ matrix.target }}.tar.gz -C stage banach banach-engine
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          (cd dist && $sum banach-${{ matrix.target }}.tar.gz > banach-${{ matrix.target }}.tar.gz.sha256)
          python3 -m pip wheel --help >/dev/null
          python/build_wheel.sh stage/banach stage/banach-engine ${{ matrix.wheel }} dist/wheels
          npm/build_platform.sh ${{ matrix.npm }} stage/banach stage/banach-engine dist/npm
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/*/banach-*.tar.gz
            artifacts/*/banach-*.tar.gz.sha256
          generate_release_notes: true

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: mkdir -p wheels && cp artifacts/*/wheels/*.whl wheels/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/

  npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: platform packages, then the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN is not set; skipping npm"; exit 0; fi
          for d in artifacts/*/npm/banach-*; do (cd "$d" && npm publish --provenance --access public); done
          cp README.md npm/banach/README.md
          cd npm/banach && npm publish --provenance --access public

  crates:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io"; exit 0; fi
          cargo publish

  docker:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository }}:latest
