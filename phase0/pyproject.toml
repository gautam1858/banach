[project]
name = "banach-phase0"
version = "0.1.0"
description = "Phase 0 feasibility tooling for Banach: routing traces, cache simulation, fidelity certificates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
banach-phase0 = "banach_phase0.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["banach_phase0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
