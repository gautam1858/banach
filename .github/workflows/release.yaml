name: release

# Release from the Actions tab: "release" -> "Run workflow", type the version (for example 0.1.4).
# The workflow checks that every version string matches, builds the binaries, installs the Linux
# wheels in a clean environment and runs the byte-exact oracle and the end-to-end smoke test on
# them, and only then creates the GitHub release and publishes to PyPI. Setup: RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.4 (must match Cargo.toml and python/pyproject.toml)"
        required: true
      dry_run:
        description: "Build and smoke-test everything, but publish nothing (no tag, no GitHub release, no PyPI)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  LLAMA_COMMIT: 9309bf1
  STORIES_URL: https://huggingface.co/ggml-org/stories15M_MOE/resolve/main/stories15M_MOE-Q8_0.gguf
  STORIES_SHA: c7aa6863f9a4b3cdf19716e2c95622dcbd3bd06989324bf1ac8e60486ef8e881
  # v0.1.4 from a pushed tag, or "v" + the version typed into "Run workflow"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the tag matches every package version
        run: |
          v="${RELEASE_TAG#v}"
          grep -q "^version = \"$v\"" Cargo.toml
          grep -q "^version = \"$v\"" python/pyproject.toml
          grep -q "__version__ = \"$v\"" python/src/banach/__init__.py
          echo "releasing $RELEASE_TAG"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            wheel: manylinux_2_28_x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            ggml: -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
          - target: aarch64-unknown-linux-gnu
            wheel: manylinux_2_28_aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            ggml: -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod
          - target: aarch64-apple-darwin
            wheel: macosx_14_0_arm64
            runner: macos-15
            container: ""
            ggml: ""
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    # macOS runners are sometimes unavailable; the Linux wheels still ship without them
    continue-on-error: ${{ matrix.runner == 'macos-15' }}
    timeout-minutes: 60
    env:
      # the macOS wheel is tagged macosx_14_0, so it must also run on macOS 14
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: tools
        shell: bash
        run: |
          if [ -n "${{ matrix.container }}" ]; then
            /opt/python/cp312-cp312/bin/python -m pip install cmake ninja wheel setuptools
            echo "/opt/python/cp312-cp312/bin" >> $GITHUB_PATH
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            dnf install -y git
          else
            brew install ninja
            python3 -m pip install --break-system-packages wheel setuptools
          fi
      - name: llama.cpp with the ladder patch
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git clone https://github.com/ggml-org/llama.cpp ../llama.cpp
          cd ../llama.cpp && git checkout $LLAMA_COMMIT
          git apply $GITHUB_WORKSPACE/engine/patches/0001-banach-precision-ladder.patch
      - name: engine
        shell: bash
        run: |
          cmake -S engine -B build-engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_DIR=$GITHUB_WORKSPACE/../llama.cpp \
            -DBANACH_PORTABLE=ON ${{ matrix.ggml }}
          ninja -C build-engine banach-engine
      - name: cli
        shell: bash
        run: cargo build --release --locked
      - name: package
        shell: bash
        run: |
          mkdir -p dist stage
          cp target/release/banach build-engine/banach-engine stage/
          tar -czf dist/banach-${{ matrix.target }}.tar.gz -C stage banach banach-engine
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          (cd dist && $sum banach-${{ matrix.target }}.tar.gz > banach-${{ matrix.target }}.tar.gz.sha256)
          python/build_wheel.sh stage/banach stage/banach-engine ${{ matrix.wheel }} dist/wheels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.target }}
          path: dist/

  smoke:
    # install the built Linux wheel in a clean environment and test the binaries it contains
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-${{ matrix.target }}
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install the wheel in a clean environment
        run: |
          python -m venv venv
          venv/bin/pip install dist/wheels/*.whl
          test "$(venv/bin/banach --version)" = "banach ${RELEASE_TAG#v}"
          echo "ENGINE=$(venv/bin/python -c 'import banach,os;print(os.path.join(os.path.dirname(banach.__file__),"bin","banach-engine"))')" >> $GITHUB_ENV
      - name: tiny model
        run: |
          curl -fsSL -o stories.gguf "$STORIES_URL"
          echo "$STORIES_SHA  stories.gguf" | sha256sum -c
          echo "Once upon a time there was a robot who" > prompt.txt
      - name: byte-exact oracle on the wheel's engine
        run: engine/exact_check.sh "$ENGINE" stories.gguf prompt.txt 16
      - name: end-to-end smoke test (compare, pick, server hardening, a completion)
        run: scripts/smoke_test.sh venv/bin/banach "$ENGINE" stories.gguf prompt.txt

  github-release:
    needs: [build, smoke]
    if: ${{ !cancelled() && needs.build.result != 'failure' && needs.smoke.result == 'success' && inputs.dry_run != true && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: build-*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/*/banach-*.tar.gz
            artifacts/*/banach-*.tar.gz.sha256
          generate_release_notes: true

  pypi:
    needs: [build, smoke]
    if: ${{ !cancelled() && needs.build.result != 'failure' && needs.smoke.result == 'success' && inputs.dry_run != true && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: build-*
      - run: mkdir -p wheels && cp artifacts/*/wheels/*.whl wheels/ && ls -l wheels/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: wheels/
